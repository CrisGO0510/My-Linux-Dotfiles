# Ventana de cmux: barra lateral + cliente anidado del servidor de sesiones.
# De tmux solo se ve la línea de modo; las únicas teclas propias son las de los modos.

set -g prefix None
set -sg escape-time 0
set -g default-terminal tmux-256color
set -g focus-events on
set -g allow-passthrough on
set -g destroy-unattached on
set -as terminal-features ',xterm-kitty:RGB:extkeys:clipboard:hyperlinks:sync'
set -s extended-keys on
set -s set-clipboard on
# kitty reconoce la ventana por este título para sus mapeos de Ctrl+Esc y Shift+Enter (userprefs.conf)
set -g set-titles on
set -g set-titles-string cmux

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39
set-hook -g client-resized 'resize-pane -t "{left}" -x 26'

set -g @mode INSERTAR
set -g status-style bg=default,fg=colour245
set -g status-left ' -- #{@mode} -- '
set -g status-left-length 20
set -g status-right-length 100
set -g status-right '#{?#{==:#{@mode},NORMAL},h/l menú↔chat  j/k mover  n nueva  d cerrar  v visual  i insertar  q salir ,#{?#{==:#{@mode},VISUAL},v seleccionar  y copiar  Esc cancelar ,Ctrl+Esc modo normal }}'
set -g window-status-format ''
set -g window-status-current-format ''

bind -n C-Escape run "$CMUX_BIN _key esc '#{session_name}'"

bind -T normal C-Escape run "$CMUX_BIN _key esc '#{session_name}'"
bind -T normal i run "$CMUX_BIN _key i '#{session_name}'"
bind -T normal h run "$CMUX_BIN _key h '#{session_name}'"
bind -T normal l run "$CMUX_BIN _key l '#{session_name}'"
bind -T normal Enter run "$CMUX_BIN _key l '#{session_name}'"
bind -T normal j run "$CMUX_BIN _key j '#{session_name}'"
bind -T normal k run "$CMUX_BIN _key k '#{session_name}'"
bind -T normal v run "$CMUX_BIN _key v '#{session_name}'"
bind -T normal C-u run "$CMUX_BIN _key C-u '#{session_name}'"
bind -T normal n run "$CMUX_BIN _key n '#{session_name}'"
bind -T normal d confirm-before -p "¿Cerrar la sesión marcada? (y/n)" { run "$CMUX_BIN _key d '#{session_name}'" }
bind -T normal q if -F '#{==:#{server_sessions},1}' {
    confirm-before -p "Es la última ventana: se apagan todos los Claude. ¿Salir? (y/n)" { run "$CMUX_BIN _key Q '#{session_name}'" }
} {
    kill-session
}
bind -T normal Q confirm-before -p "¿Apagar cmux y todos los Claude? (y/n)" { run "$CMUX_BIN _key Q '#{session_name}'" }
# En modo normal las teclas sin función no deben llegar al Claude
bind -T normal Any switch-client -T normal
