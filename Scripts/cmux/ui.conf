# Ventana de cmux: barra lateral + cliente anidado del servidor de sesiones.
# De tmux solo se ve la línea de modo. El único modo es el vim de Claude (@claude_vim); las acciones de
# cmux son teclas sueltas que solo actúan en NORMAL y fuera del modo de copia (@copy) y tapan las de Claude.

set -g prefix None
set -sg escape-time 0
set -g default-terminal tmux-256color
set -g focus-events on
set -g allow-passthrough on
set -g destroy-unattached on
set -as terminal-features ',xterm-kitty:RGB:extkeys:clipboard:hyperlinks:sync'
set -s extended-keys on
set -s set-clipboard on
# kitty reconoce la ventana por este título para sus mapeos de Shift+Enter y Ctrl+Shift+H/L (userprefs.conf)
set -g set-titles on
set -g set-titles-string cmux

set -g pane-border-style fg=colour238
set -g pane-active-border-style 'fg=#{?#{==:#{@claude_vim},INSERT},colour114,#{?#{==:#{@claude_vim},NORMAL},colour39,#{?#{m:VISUAL*,#{@claude_vim}},colour176,colour39}}}'
set -g @width 26
set-hook -g window-resized 'run -b "$CMUX_BIN _fit"'
# La barra lateral es solo visual: cualquier select-pane (clic en ella o en el borde) devuelve el foco al chat
set-hook -g after-select-pane "select-pane -t '{right}'"

set -g status-style bg=default,fg=colour245
set -g status-left ' #{?#{==:#{@copy},1},-- VISUAL --,#{?#{m:VISUAL*,#{@claude_vim}},-- VISUAL --,#{?#{==:#{@claude_vim},NORMAL},-- NORMAL --,#{?#{==:#{@claude_vim},INSERT},-- INSERT --,}}}} '
set -g status-left-length 20
set -g status-right-length 120
set -g status-right '#{?#{==:#{@copy},1},v seleccionar · y copiar · Esc cancelar ,#{?#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}},J/K sesión · H/L ordenar · n nueva · r renombrar · R relanzar · v copiar · q cerrar · Q apagar · X minimizar ,}}'
set -g window-status-format ''
set -g window-status-current-format ''

bind -n C-S-h run "$CMUX_BIN _key narrow '#{session_name}'"
bind -n C-S-l run "$CMUX_BIN _key widen '#{session_name}'"

# Claude va en pantalla alterna: no hay historial de tmux, el desplazamiento lo hace él con RePág/AvPág
bind -n C-u if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "send-keys -t '{right}' PPage" "send-keys -t '{right}' C-u"
bind -n C-d if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "send-keys -t '{right}' NPage" "send-keys -t '{right}' C-d"
# Teclas mapeadas a scroll:lineUp/lineDown en claude/keybindings.json
bind -n C-y if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "send-keys -t '{right}' C-M-Up" "send-keys -t '{right}' C-y"
bind -n C-e if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "send-keys -t '{right}' C-M-Down" "send-keys -t '{right}' C-e"
# Las teclas que en el modo vim de Claude pasan a INSERT adelantan @claude_vim, sin esperar al statusline
bind -n i if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' i" "send-keys -t '{right}' i"
bind -n I if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' I" "send-keys -t '{right}' I"
bind -n a if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' a" "send-keys -t '{right}' a"
bind -n A if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' A" "send-keys -t '{right}' A"
bind -n o if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' o" "send-keys -t '{right}' o"
bind -n O if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' O" "send-keys -t '{right}' O"
bind -n s if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' s" "send-keys -t '{right}' s"
bind -n S if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' S" "send-keys -t '{right}' S"
bind -n c if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' c" "send-keys -t '{right}' c"
bind -n C if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "set @claude_vim INSERT ; send-keys -t '{right}' C" "send-keys -t '{right}' C"

# Acciones de cmux en NORMAL; en el resto de modos la tecla llega al chat tal cual
bind -n J if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "run \"$CMUX_BIN _key next '#{session_name}'\"" "send-keys -t '{right}' J"
bind -n K if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "run \"$CMUX_BIN _key prev '#{session_name}'\"" "send-keys -t '{right}' K"
bind -n H if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "run \"$CMUX_BIN _key up '#{session_name}'\"" "send-keys -t '{right}' H"
bind -n L if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "run \"$CMUX_BIN _key down '#{session_name}'\"" "send-keys -t '{right}' L"
bind -n n if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "run \"$CMUX_BIN _key n '#{session_name}'\"" "send-keys -t '{right}' n"
bind -n r if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "run \"$CMUX_BIN _key r '#{session_name}'\"" "send-keys -t '{right}' r"
bind -n v if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' "run \"$CMUX_BIN _key v '#{session_name}'\"" "send-keys -t '{right}' v"
bind -n R if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' { confirm-before -y -p "¿Relanzar el Claude de esta sesión? (Y/n)" { run "$CMUX_BIN _key R '#{session_name}'" } } "send-keys -t '{right}' R"
bind -n q if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' { confirm-before -y -p "¿Cerrar la sesión visible? (Y/n)" { run "$CMUX_BIN _key d '#{session_name}'" } } "send-keys -t '{right}' q"
bind -n Q if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' { confirm-before -y -p "¿Apagar cmux y todos los Claude? (Y/n)" { run "$CMUX_BIN _key Q '#{session_name}'" } } "send-keys -t '{right}' Q"
bind -n X if -F '#{&&:#{==:#{@claude_vim},NORMAL},#{!=:#{@copy},1}}' detach-client "send-keys -t '{right}' X"
