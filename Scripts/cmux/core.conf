# Servidor de sesiones de cmux: un Claude por sesión, sin interfaz propia.

set -g prefix None
set -g status off
set -sg escape-time 0
set -g default-terminal tmux-256color
set -g history-limit 50000
set -g focus-events on
set -g allow-passthrough on
# Al cerrarse un Claude, el cliente pasa a otra sesión en vez de desconectarse
set -g detach-on-destroy off
# Este servidor corre dentro del panel de cmux-ui, que se anuncia como tmux-256color
set -as terminal-features ',tmux*:RGB:extkeys:clipboard:hyperlinks:sync'
set -s extended-keys on
set -s set-clipboard on
# Si el servidor nació por ssh, sin esto un Claude abierto en local no puede pegar imágenes
set -ga update-environment ' WAYLAND_DISPLAY'

set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

set-hook -g pane-mode-changed 'run -b "$CMUX_BIN _modesync"'
set-hook -g session-created 'run -b "$CMUX_BIN _refresh"'
set-hook -g session-closed 'run -b "$CMUX_BIN _refresh"'
set-hook -g client-session-changed 'run -b "$CMUX_BIN _refresh"'
