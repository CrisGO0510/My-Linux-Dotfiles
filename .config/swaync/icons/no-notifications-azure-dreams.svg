<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Azure Dreams No Notifications Icon -->
  
  <!-- Background circle with glassmorphism effect -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#2e2e4e;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:0.9"/>
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#74b9ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4fd1c7;stop-opacity:0.8"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ddd6fe;stop-opacity:0.7"/>
    </linearGradient>
    
    <!-- Glassmorphism blur filter -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
    
    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur result="coloredBlur" stdDeviation="3"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring with Azure Dreams colors -->
  <circle cx="60" cy="60" r="50" 
          fill="url(#backgroundGradient)" 
          stroke="#4fd1c7" 
          stroke-width="2" 
          stroke-opacity="0.6"
          filter="url(#blur)"/>
  
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="35" 
          fill="none" 
          stroke="url(#iconGradient)" 
          stroke-width="1.5" 
          stroke-opacity="0.4"/>
  
  <!-- Central zen-like icon -->
  <!-- Minimalist bell shape -->
  <path d="M45 45 C45 35, 55 30, 60 30 C65 30, 75 35, 75 45 L75 60 C75 65, 72 65, 70 67 L50 67 C48 65, 45 65, 45 60 Z" 
        fill="url(#iconGradient)" 
        opacity="0.7"
        filter="url(#glow)"/>
  
  <!-- Bell clapper -->
  <circle cx="60" cy="62" r="3" fill="url(#accentGradient)" opacity="0.8"/>
  
  <!-- Peaceful floating particles -->
  <circle cx="35" cy="35" r="2" fill="#74b9ff" opacity="0.4"/>
  <circle cx="85" cy="40" r="1.5" fill="#a29bfe" opacity="0.5"/>
  <circle cx="30" cy="80" r="1" fill="#4fd1c7" opacity="0.6"/>
  <circle cx="88" cy="85" r="1.8" fill="#6c5ce7" opacity="0.3"/>
  
  <!-- Subtle animated elements (static for now) -->
  <path d="M40 25 Q50 20, 60 25 Q70 20, 80 25" 
        stroke="url(#accentGradient)" 
        stroke-width="1" 
        fill="none" 
        opacity="0.3"/>
        
  <path d="M25 95 Q40 90, 55 95 Q70 90, 85 95" 
        stroke="url(#accentGradient)" 
        stroke-width="1" 
        fill="none" 
        opacity="0.2"/>
  
  <!-- Central text area placeholder (will be hidden) -->
  <text x="60" y="95" 
        text-anchor="middle" 
        fill="#ddd6fe" 
        font-family="monospace" 
        font-size="10" 
        opacity="0.6">peaceful</text>
</svg>