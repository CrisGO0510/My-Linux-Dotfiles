<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="20" fill="#1a1a2e" stroke="#4fd1c7" stroke-width="2"/>
  
  <!-- Battery outline -->
  <rect x="12" y="16" width="20" height="16" rx="2" fill="none" stroke="#6c5ce7" stroke-width="2"/>
  
  <!-- Battery terminal -->
  <rect x="32" y="20" width="2" height="8" rx="1" fill="#6c5ce7"/>
  
  <!-- Battery fill indicator -->
  <rect x="14" y="18" width="16" height="12" rx="1" fill="#74b9ff" opacity="0.8"/>
  
  <!-- Battery percentage text -->
  <text x="22" y="26" text-anchor="middle" fill="#ddd6fe" font-family="monospace" font-size="8" font-weight="bold">%</text>
</svg>