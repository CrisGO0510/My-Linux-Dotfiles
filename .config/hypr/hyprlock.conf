# hyprlock — tema oscuro/morado con layout tipo "dashboard":
#   reloj grande, fecha, clima (abajo-izq), now-playing (abajo-der) y
#   tarjeta de bienvenida con el campo de contrasena (centro-abajo).
# Scripts de apoyo en $scrPath: lock-weather.sh, lock-player.sh, lock-art.sh

$scrPath = $HOME/dotfiles/Scripts/hypr

# Paleta morada reutilizada en todo el lock.
$accent      = rgb(180, 150, 255)
$accent_soft = rgb(200, 170, 255)
$card_bg     = rgba(30, 10, 50, 0.45)
$card_border = rgba(120, 80, 180, 0.55)

general {
    grace = 3
    no_fade_in = false
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/dotfiles/assets/lock.png
    blur_passes = 2
    blur_size = 5
}

# Tinte morado global sobre el fondo (hyprlock no tinta el background
# directamente, asi que usamos una shape grande semitransparente).
shape {
    monitor =
    size = 6000, 4000
    color = rgba(40, 15, 65, 0.35)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# ---------------------------------------------------------------- RELOJ
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $accent
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 4

    position = 0, 190
    halign = center
    valign = center
}

# ----------------------------------------------------------------- FECHA
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = $accent_soft
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 70
    halign = center
    valign = center
}

# --------------------------------------------------- CLIMA (abajo-izq)
shape {
    monitor =
    size = 320, 76
    color = $card_bg
    rounding = 18
    border_size = 2
    border_color = $card_border
    position = 50, 50
    halign = left
    valign = bottom
}

# Icono del clima.
label {
    monitor =
    text = cmd[update:600000] $scrPath/lock-weather.sh icon
    color = $accent_soft
    font_size = 34
    font_family = JetBrainsMono Nerd Font

    position = 90, 88
    halign = left
    valign = bottom
}

# Temperatura.
label {
    monitor =
    text = cmd[update:600000] $scrPath/lock-weather.sh temp
    color = $accent
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold

    position = 145, 98
    halign = left
    valign = bottom
}

# Condicion (texto).
label {
    monitor =
    text = cmd[update:600000] $scrPath/lock-weather.sh cond
    color = $accent_soft
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 145, 70
    halign = left
    valign = bottom
}

# --------------------------------------------- NOW-PLAYING (abajo-der)
shape {
    monitor =
    size = 360, 88
    color = $card_bg
    rounding = 18
    border_size = 2
    border_color = $card_border
    position = -50, 50
    halign = right
    valign = bottom
}

# Caratula / avatar (se actualiza con la portada del medio actual).
image {
    monitor =
    path = $HOME/dotfiles/assets/hoshino_ai.png
    size = 64
    rounding = -1
    border_size = 2
    border_color = $card_border
    reload_time = 2
    reload_cmd = $scrPath/lock-art.sh

    position = -62, 62
    halign = right
    valign = bottom
}

# Titulo de lo que suena.
label {
    monitor =
    text = cmd[update:2000] $scrPath/lock-player.sh title
    color = $accent
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold

    position = -110, 98
    halign = right
    valign = bottom
}

# Artista + icono de estado (play/pause).
label {
    monitor =
    text = cmd[update:2000] echo "$($scrPath/lock-player.sh status) $($scrPath/lock-player.sh artist)"
    color = $accent_soft
    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = -110, 72
    halign = right
    valign = bottom
}

# ----------------------------------------- BIENVENIDA + CONTRASENA (centro)
label {
    monitor =
    text = cmd[update:0] echo "Welcome back, $(whoami)"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 235
    halign = center
    valign = bottom
}

label {
    monitor =
    text = Logging in to Hyprland
    color = $accent_soft
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, 210
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 3

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1

    rounding = 22
    outer_color = rgba(80, 50, 100, 0.5)
    inner_color = rgba(30, 10, 50, 0.5)
    font_color = $accent
    fade_on_empty = true
    placeholder_text = <i>Password...</i>

    position = 0, 130
    halign = center
    valign = bottom
}
