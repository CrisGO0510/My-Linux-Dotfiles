general {
    grace = 5         # Tiempo en segundos antes de bloquear al suspender
    no_fade_in = false # Animación de entrada (opcional)
}

background {
    monitor = eDP-1   # O "*" para todos los monitores
    path = ~/dotfiles/assets/lock.png
    blur_passes = 3   # Difuminado (opcional)
    noise = 0.02      # Ruido sutil en el fondo (opcional)
}

input-field {
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = true
    placeholder_text =  Ingresa tu contraseña
    shadow_passes = 2

    position = 0, -20
    monitor = eDP-1
    halign = center
    valign = center

    outer_color = rgba(0,0,0,0.5)
    inner_color = rgba(255,255,255,0.2)
    font_color = rgb(200,200,200)
    fail_color = rgb(255, 50, 50)
}

label {
    text = Hola, bienvenido de nuevo 
    color = rgb(255,255,255)
    font_size = 24
    font_family = CaskaydiaCove Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Puedes agregar más labels si quieres hora, fecha, etc.
# Ejemplo: mostrar hora
label {
    text = cmd[update:1000] date '+%H:%M:%S'
    color = rgb(255,255,255)
    font_size = 32
    font_family = CaskaydiaCove Nerd Font
    position = 0, -120
    halign = center
    valign = center
}

# Ejemplo: mostrar canción actual (si usas MPRIS)
label {
    text = cmd[update:1000] playerctl metadata --format '{{title}}  {{artist}}'
    color = rgb(180, 180, 180)
    font_size = 16
    font_family = CaskaydiaCove Nerd Font
    position = 0, 150
    halign = center
    valign = center
}
