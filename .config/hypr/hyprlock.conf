general {
    grace = 3           
    no_fade_in = false  
}

background {
    monitor =
    path = $HOME/dotfiles/assets/lock.png
    blur_passes = 1
}

overlay {
    color = rgba(80, 50, 100, 0.3)  
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgb(180, 150, 255)  
    font_size = 112
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgb(180, 150, 255)
    font_size = 112
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> $(date +'%A') </big></b>"
    color = rgb(200, 170, 255)
    font_size = 22
    font_family = JetBrainsMono Nerd Font 10

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] echo "<b> $(date +'%d %b') </b>"
    color = rgb(200, 170, 255)
    font_size = 18
    font_family = JetBrainsMono Nerd Font 10

    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26 
    dots_spacing = 0.64 
    dots_center = true
    dots_rouding = -1

    rounding = 22
    outer_color = rgba(80, 50, 100, 0.5)
    inner_color = rgba(30, 10, 50, 0.5)
    font_color = rgb(180, 150, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i> 

    position = 0, 120
    halign = center
    valign = bottom
}
