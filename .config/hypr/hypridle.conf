$LOCKSCREEN = hyprlock 

general {
    lock_cmd = $LOCKSCREEN
    unlock_cmd =
    before_sleep_cmd = $LOCKSCREEN
    after_sleep_cmd =
    ignore_dbus_inhibit = 0
}

listener {
    timeout = 60
on-timeout = { brightnessctl -s && brightnessctl s 1% ;}
    on-resume = brightnessctl -r
}

listener {
    timeout = 120
    on-timeout = $LOCKSCREEN
}

listener {
    timeout = 300
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 500
}

source = ~/.config/hypridle/*
