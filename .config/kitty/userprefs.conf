# Set your personal kitty configuration here

confirm_os_window_close 0
allow_remote_control yes
map ctrl+shift+h clear
map ctrl+shift+j clear
map ctrl+shift+k none
map ctrl+shift+l none

map alt+h clear
map alt+j clear
map alt+k none
map alt+l none

# Ventana nueva en el mismo directorio; dentro de "kitten ssh" nace ya conectada al remoto
map ctrl+shift+enter launch --cwd=current --type=os-window

# Bajo tmux kitty envía estas teclas igual que Esc y Enter; cmux necesita distinguirlas
map --when-focus-on title:^cmux$ ctrl+escape send_text all \x1b[27;5u
map --when-focus-on title:^cmux$ shift+enter send_text all \x1b[13;2u
